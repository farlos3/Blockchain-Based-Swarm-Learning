# The swarm network: one Raft orderer and five peers, one peer per organization.
#
# Ledger data lives in named volumes so `network.sh down` can wipe a run completely and
# `network.sh up` always starts from a known state — a half-migrated ledger is the most
# confusing thing to debug in a demo.
#
# Peers mount the Docker socket because they build and run chaincode in their own
# containers. That is how Fabric's default (non-external) chaincode lifecycle works.

# One compose project, so `docker compose ps`, Docker Desktop and `down` all treat the
# orderer, the peers, the five chaincode services and the gateway as a single unit
# instead of leaving stray containers behind.
name: sl-fabric

networks:
  swarm_net:
    name: swarm_net

volumes:
  orderer.swarm.local:
  peer0.org1.swarm.local:
  peer0.org2.swarm.local:
  peer0.org3.swarm.local:
  peer0.org4.swarm.local:
  peer0.org5.swarm.local:

x-peer: &peer-defaults
  image: hyperledger/fabric-peer:2.5.13
  restart: on-failure
  networks:
    - swarm_net
  environment: &peer-env
    FABRIC_LOGGING_SPEC: INFO
    CORE_PEER_TLS_ENABLED: "true"
    CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
    CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
    CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
    CORE_PEER_PROFILE_ENABLED: "false"
    CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
    CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: swarm_net
    CORE_CHAINCODE_EXECUTETIMEOUT: 300s
    CORE_PEER_GOSSIP_ORGLEADER: "true"
    CORE_PEER_GOSSIP_USELEADERELECTION: "false"
    CORE_LEDGER_STATE_STATEDATABASE: goleveldb
    CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9440
    CORE_METRICS_PROVIDER: prometheus
  command: peer node start

# The peers do not build or launch the chaincode (Fabric's ccaas mode): each organization
# runs its own instance and the peer dials it. The package id differs per org because each
# package embeds that org's address, so ./network.sh deploy writes them into .env and
# compose reads them from there.
#
# They sit behind a profile because they cannot start until deploy has computed those ids,
# so a plain `up` has to skip them. The ids default to empty rather than being marked
# required: compose interpolates every service before it applies profiles, so a required
# variable here would break `up` as well.
x-chaincode: &chaincode-defaults
  build:
    context: ../chaincode/sl-ledger
  image: sl-ledger:1.0
  restart: on-failure
  profiles: [chaincode]
  networks:
    - swarm_net

services:
  orderer.swarm.local:
    container_name: orderer.swarm.local
    image: hyperledger/fabric-orderer:2.5.13
    restart: on-failure
    networks:
      - swarm_net
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /etc/hyperledger/fabric/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /etc/hyperledger/fabric/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /etc/hyperledger/fabric/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/etc/hyperledger/fabric/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /etc/hyperledger/fabric/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /etc/hyperledger/fabric/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/etc/hyperledger/fabric/tls/ca.crt]"
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      # the channel participation API: channels are joined after startup, not baked in
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /etc/hyperledger/fabric/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /etc/hyperledger/fabric/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: "[/etc/hyperledger/fabric/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/etc/hyperledger/fabric/tls/ca.crt]"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9440
      ORDERER_METRICS_PROVIDER: prometheus
    ports:
      - "7050:7050"
      - "7053:7053"
      - "9440:9440"
    volumes:
      - ../organizations/ordererOrganizations/swarm.local/orderers/orderer.swarm.local/msp:/etc/hyperledger/fabric/msp:ro
      - ../organizations/ordererOrganizations/swarm.local/orderers/orderer.swarm.local/tls:/etc/hyperledger/fabric/tls:ro
      - orderer.swarm.local:/var/hyperledger/production/orderer

  peer0.org1.swarm.local:
    <<: *peer-defaults
    container_name: peer0.org1.swarm.local
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.org1.swarm.local
      CORE_PEER_ADDRESS: peer0.org1.swarm.local:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.org1.swarm.local:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org1.swarm.local:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org1.swarm.local:7051
      CORE_PEER_LOCALMSPID: Org1MSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
    ports:
      - "7051:7051"
      - "9441:9440"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/org1.swarm.local/peers/peer0.org1.swarm.local/msp:/etc/hyperledger/fabric/msp:ro
      - ../organizations/peerOrganizations/org1.swarm.local/peers/peer0.org1.swarm.local/tls:/etc/hyperledger/fabric/tls:ro
      - peer0.org1.swarm.local:/var/hyperledger/production

  peer0.org2.swarm.local:
    <<: *peer-defaults
    container_name: peer0.org2.swarm.local
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.org2.swarm.local
      CORE_PEER_ADDRESS: peer0.org2.swarm.local:8051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:8051
      CORE_PEER_CHAINCODEADDRESS: peer0.org2.swarm.local:8052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:8052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org2.swarm.local:8051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org2.swarm.local:8051
      CORE_PEER_LOCALMSPID: Org2MSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
    ports:
      - "8051:8051"
      - "9442:9440"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/org2.swarm.local/peers/peer0.org2.swarm.local/msp:/etc/hyperledger/fabric/msp:ro
      - ../organizations/peerOrganizations/org2.swarm.local/peers/peer0.org2.swarm.local/tls:/etc/hyperledger/fabric/tls:ro
      - peer0.org2.swarm.local:/var/hyperledger/production

  peer0.org3.swarm.local:
    <<: *peer-defaults
    container_name: peer0.org3.swarm.local
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.org3.swarm.local
      CORE_PEER_ADDRESS: peer0.org3.swarm.local:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.org3.swarm.local:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org3.swarm.local:9051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org3.swarm.local:9051
      CORE_PEER_LOCALMSPID: Org3MSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
    ports:
      - "9051:9051"
      - "9443:9440"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/org3.swarm.local/peers/peer0.org3.swarm.local/msp:/etc/hyperledger/fabric/msp:ro
      - ../organizations/peerOrganizations/org3.swarm.local/peers/peer0.org3.swarm.local/tls:/etc/hyperledger/fabric/tls:ro
      - peer0.org3.swarm.local:/var/hyperledger/production

  peer0.org4.swarm.local:
    <<: *peer-defaults
    container_name: peer0.org4.swarm.local
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.org4.swarm.local
      CORE_PEER_ADDRESS: peer0.org4.swarm.local:10051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:10051
      CORE_PEER_CHAINCODEADDRESS: peer0.org4.swarm.local:10052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:10052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org4.swarm.local:10051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org4.swarm.local:10051
      CORE_PEER_LOCALMSPID: Org4MSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
    ports:
      - "10051:10051"
      - "9444:9440"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/org4.swarm.local/peers/peer0.org4.swarm.local/msp:/etc/hyperledger/fabric/msp:ro
      - ../organizations/peerOrganizations/org4.swarm.local/peers/peer0.org4.swarm.local/tls:/etc/hyperledger/fabric/tls:ro
      - peer0.org4.swarm.local:/var/hyperledger/production

  peer0.org5.swarm.local:
    <<: *peer-defaults
    container_name: peer0.org5.swarm.local
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.org5.swarm.local
      CORE_PEER_ADDRESS: peer0.org5.swarm.local:11051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:11051
      CORE_PEER_CHAINCODEADDRESS: peer0.org5.swarm.local:11052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:11052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org5.swarm.local:11051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org5.swarm.local:11051
      CORE_PEER_LOCALMSPID: Org5MSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
    ports:
      - "11051:11051"
      - "9445:9440"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/org5.swarm.local/peers/peer0.org5.swarm.local/msp:/etc/hyperledger/fabric/msp:ro
      - ../organizations/peerOrganizations/org5.swarm.local/peers/peer0.org5.swarm.local/tls:/etc/hyperledger/fabric/tls:ro
      - peer0.org5.swarm.local:/var/hyperledger/production

  # ---------- chaincode services, one per organization ----------

  sl-ledger.org1.swarm.local:
    <<: *chaincode-defaults
    container_name: sl-ledger.org1.swarm.local
    environment:
      CHAINCODE_ID: ${CC_ID_ORG1:-}
      CHAINCODE_SERVER_ADDRESS: 0.0.0.0:9999

  sl-ledger.org2.swarm.local:
    <<: *chaincode-defaults
    container_name: sl-ledger.org2.swarm.local
    environment:
      CHAINCODE_ID: ${CC_ID_ORG2:-}
      CHAINCODE_SERVER_ADDRESS: 0.0.0.0:9999

  sl-ledger.org3.swarm.local:
    <<: *chaincode-defaults
    container_name: sl-ledger.org3.swarm.local
    environment:
      CHAINCODE_ID: ${CC_ID_ORG3:-}
      CHAINCODE_SERVER_ADDRESS: 0.0.0.0:9999

  sl-ledger.org4.swarm.local:
    <<: *chaincode-defaults
    container_name: sl-ledger.org4.swarm.local
    environment:
      CHAINCODE_ID: ${CC_ID_ORG4:-}
      CHAINCODE_SERVER_ADDRESS: 0.0.0.0:9999

  sl-ledger.org5.swarm.local:
    <<: *chaincode-defaults
    container_name: sl-ledger.org5.swarm.local
    environment:
      CHAINCODE_ID: ${CC_ID_ORG5:-}
      CHAINCODE_SERVER_ADDRESS: 0.0.0.0:9999

  # ---------- the gateway and its monitor page ----------

  gateway:
    container_name: sl-gateway
    build:
      context: ../gateway
    image: sl-gateway:1.0
    restart: on-failure
    networks:
      - swarm_net
    environment:
      # inside this network the peers answer to their container names, not localhost
      SL_IN_CLUSTER: "1"
      SL_ORGS_DIR: /organizations
      # the trainer runs on the host: it needs torch and the dataset, which would make
      # this image several gigabytes for no benefit in a demo
      SL_TRAINER_URL: http://host.docker.internal:8900
      # one channel per model, written into .env by ./network.sh deploy
      SL_CHANNELS: ${SL_CHANNELS:-swarm-blood-logistic,swarm-blood-mlp,swarm-blood-cnn,swarm-path-logistic,swarm-path-mlp,swarm-path-cnn}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SL_GATEWAY_PORT:-8899}:8899"
    volumes:
      # read-only: the gateway signs with these identities and must never modify them
      - ../organizations:/organizations:ro
    depends_on:
      - peer0.org1.swarm.local
      - peer0.org2.swarm.local
      - peer0.org3.swarm.local
      - peer0.org4.swarm.local
      - peer0.org5.swarm.local
