# The swarms this network runs: one line per dataset, then how many organizations its
# swarm has (always Org1..OrgN) and the models trained on it. Every dataset-model pair
# gets its own channel, swarm-<dataset>-<model>, with its own blocks and round numbers.
#
# This file is the only list: network.sh creates the channels from it and writes them into
# .env, which the gateway and its monitor read; architecture/centric/run.py refuses a model
# that has no channel here. After an edit, `./network.sh deploy` creates the new channels
# on the running network (it restarts the gateway, so not while a run is training).
#
# A swarm size needs a matching SwarmN profile in configtx.yaml (3, 5, 6 and 10 exist),
# and at most 10 organizations (crypto-config.yaml). Names: lower-case letters and digits;
# a model may also use "_".
#
# dataset   orgs  models

# the IDS replication (architecture/centric): Bilal et al. 2026, Table 2 client counts,
# with the paper's two backbones
edge        6     lstm transformer
cic         10    lstm transformer
tii         5     lstm transformer
combined    3     lstm transformer

# the multimodal DDoS swarm (architecture/EAI): Nguyen-Khanh et al. 2025, Tables 9-11 host
# counts, one swarm per scenario, with the paper's three networks
eai1        3     packet flow multimodal
eai2        3     packet flow multimodal
eai3        5     packet flow multimodal
