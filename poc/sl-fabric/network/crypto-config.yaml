# Certificate material for the swarm network, generated by `cryptogen`.
#
# One org per swarm node, because the point of the thesis is that each participant is a
# separate organization with its own identity — not five identities inside one org.
# A real deployment would issue these through Fabric CA per org; cryptogen is used here
# so the whole network can be rebuilt from scratch with one command.
#
# EnableNodeOUs lets the MSP tell a peer, an admin, and a client apart from the OU in
# their certificate, which is what the chaincode's GetMSPID check relies on.

OrdererOrgs:
  - Name: Orderer
    Domain: swarm.local
    EnableNodeOUs: true
    Specs:
      - Hostname: orderer
        SANS:
          - localhost

PeerOrgs:
  - Name: Org1
    Domain: org1.swarm.local
    EnableNodeOUs: true
    Template:
      Count: 1
      # clients run on the host and reach the peer as localhost:<port>, so the TLS
      # certificate has to name localhost as well as the container hostname
      SANS:
        - localhost
    Users:
      Count: 1

  - Name: Org2
    Domain: org2.swarm.local
    EnableNodeOUs: true
    Template:
      Count: 1
      # clients run on the host and reach the peer as localhost:<port>, so the TLS
      # certificate has to name localhost as well as the container hostname
      SANS:
        - localhost
    Users:
      Count: 1

  - Name: Org3
    Domain: org3.swarm.local
    EnableNodeOUs: true
    Template:
